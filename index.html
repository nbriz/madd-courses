<style>
  
  main {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  
  img {
    margin-top: 100px;
    width: 400px;
  }
  
  cite {
    margin-bottom: 20px;
  }

</style>

<main>
  <img src="..." alt="...">

  <p>
    ...
  </p>

  <cite>...</cite>

  <button>next</button>
</main>

<script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library@1.0.1/build/nn.min.js"></script>
<script>

  let url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR6fMbf4UJfsvmZkzPLvmftrxaYwOF2DR-4y7kjklm8gns7JJCuEbt7H21Mc0JZs_ism6rvekxM-D14/pub?output=csv'
  // to make data accessible to my code, 
  // in File >Share > Publish to Web, 
  // and then selecting "Comma-separated values (csv)" as the format.
  
  let state = {
    data: null,
    post: 0
  }
  
  async function loadData () {
    let res = await fetch(url)
    let csv = await res.text()
    state.data = nn.parse(csv)
    render()
  }
  
  function render () {
    let post = state.data[state.post]
    nn.get('img').set('src', post.image)
    nn.get('p').content(post.description)
    let cred = 'by ' + post.author
    nn.get('cite').content(cred)
  }
  
  function nextPost () {
    state.post += 1
    if (state.post > state.data.length) {
      state.post = 0
    }
    render()
  }

  nn.on('load', loadData)
  nn.get('button').on('click', nextPost)

</script>
